name: Desktop builds

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
    paths: ['desktop/**', 'packaging/**', 'src/**', 'css/**', 'assets/**', 'index.html', 'package.json', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'packaging/**', 'src/**', 'css/**', 'assets/**', 'index.html', 'package.json', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-and-linux:
    name: Windows installer and Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          packaging/build-desktop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: audiospace-desktop
          path: dist/
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  arch:
    name: Arch Linux one-command install
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git go sudo
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install as a normal user, run, uninstall
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          cp -a "$GITHUB_WORKSPACE" /home/builder/src
          chown -R builder: /home/builder/src
          su builder -c 'cd ~/src && ./packaging/arch/install.sh'
          audiospace --version
          su builder -c 'audiospace --no-browser --port 47850 > /tmp/audiospace.log 2>&1 &'
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:47850/__desktop/ping && break; sleep 0.5; done
          curl -fs -o /dev/null http://127.0.0.1:47850/src/main.js
          pacman -R --noconfirm audiospace-git
