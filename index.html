<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AudioSpace — Virtual Audio Environment Simulator</title>
    <meta name="description" content="A browser-based spatial audio engine and music player: simulate 100 bookshelf speakers, 100 subwoofers, AV receivers, crossovers, EQ and a physically-modelled room." />
    <meta name="theme-color" content="#060609" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/views.css" />
    <link rel="stylesheet" href="css/studio.css" />
    <link rel="modulepreload" href="src/ui/app.js" />
    <link rel="modulepreload" href="src/audio/engine.js" />
  </head>
  <body>
    <div id="app" class="boot">
      <div class="boot-screen" role="status">
        <div class="boot-mark"></div>
        <div class="boot-name">AudioSpace</div>
        <div class="boot-sub">Warming up the amplifiers…</div>
      </div>
    </div>
    <noscript>
      <div class="fatal"><h1>AudioSpace needs JavaScript</h1><p>Please enable JavaScript to use the simulator.</p></div>
    </noscript>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
